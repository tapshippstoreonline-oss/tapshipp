
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b4e">

  <title>Product | TAPSHIPP</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">

  <script defer src="app.js"></script>

  <style>
    /* TAPSHIPP LOGO - HEADER AND FOOTER */

    .site-header .brand,
    .site-footer .footer-brand {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .site-logo {
      height: 48px;
      width: auto;
      max-width: 190px;
      object-fit: contain;
      display: block;
    }

    .footer-logo {
      height: 48px;
      width: auto;
      max-width: 190px;
      object-fit: contain;
      display: block;
    }

    /* MOBILE RESPONSIVE LOGOS */

    @media (max-width: 600px) {
      .site-logo {
        height: 38px;
        max-width: 140px;
      }

      .footer-logo {
        height: 40px;
        max-width: 150px;
      }
    }
  </style>
</head>

<body data-page="product">

  <!-- ================= HEADER ================= -->

  <header class="site-header">

    <a class="brand" href="index.html">
      <img
        src="tapshipp-logo.png"
        alt="TAPSHIPP Logo"
        class="site-logo"
      >
    </a>

    <a class="back-link" href="index.html">
      ← Continue shopping
    </a>

    <a class="cart-link" href="checkout.html">
      Cart
      <span id="cartCount" class="count">0</span>
    </a>

  </header>


  <!-- ================= MAIN CONTENT ================= -->

  <main class="page-shell">

    <div class="breadcrumbs">
      <a href="index.html">Home</a> /
      <span id="crumbName">Product</span>
    </div>

    <!-- PRODUCT DETAILS -->

    <div id="productDetail" class="product-detail">

      <div class="loading">
        Loading product details...
      </div>

    </div>


    <!-- RELATED PRODUCTS -->

    <section class="section related-section">

      <div class="section-heading">

        <div>
          <span class="eyebrow">KEEP EXPLORING</span>
          <h2>You may also like</h2>
        </div>

      </div>

      <div
        id="relatedGrid"
        class="product-grid compact-grid">
      </div>

    </section>

  </main>


  <!-- ================= FOOTER ================= -->

  <footer class="site-footer">

    <a class="brand footer-brand" href="index.html">

      <img
        src="tapshipp-logo.png"
        alt="TAPSHIPP Logo"
        class="footer-logo"
      >

    </a>

    <p>
      © <span id="year"></span>
      TAPSHIPP. All rights reserved.
    </p>

  </footer>


</body>
</html>
